<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OSC Academy · Cuenta Cliente</title><style>:root{--bg:#06111d;--panel:#0b1827;--line:#173149;--text:#f5f8fc;--muted:#9dafc2;--blue:#2f83ff;--green:#18d17e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial}.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{padding:20px 14px;background:#071522;border-right:1px solid var(--line)}.brand{font-weight:800;font-size:18px;margin-bottom:20px}.brand span{color:#38a7ff}.nav{display:block;color:#dce7f1;text-decoration:none;padding:10px;border-radius:8px;margin:2px 0;font-size:13px}.nav:hover,.nav.active{background:#143c69}.main{padding:24px}.panel{background:linear-gradient(180deg,#0b1928,#091725);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#0b1827;border:1px solid var(--line);border-radius:12px;padding:16px}.card span{color:var(--muted);font-size:11px}.card strong{display:block;font-size:24px;margin-top:8px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.empty{text-align:center;color:#74889c;padding:24px}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{display:none}.summary{grid-template-columns:1fr}}</style></head><body><div class="shell"><aside class="side"><div class="brand"><span>OSC</span> PAYMENT ACADEMY</div><a class="nav" href="index.html">⌂ Dashboard</a><a class="nav active" href="cuenta_cliente.html">💳 Cuenta del Cliente</a></aside><main class="main"><h1>💳 Cuenta del Cliente</h1><p style="color:var(--muted)">Movimientos generados al procesar archivos Incoming internacionales.</p><section class="summary"><article class="card"><span>CLIENTE</span><strong id="customer">Cliente Demo OSC</strong></article><article class="card"><span>MOVIMIENTOS</span><strong id="count">0</strong></article><article class="card"><span>ÚLTIMA ACTUALIZACIÓN</span><strong id="updated" style="font-size:16px">—</strong></article></section><section class="panel"><h2>Movimientos</h2><table class="table"><thead><tr><th>Fecha</th><th>Red</th><th>Comercio</th><th>País</th><th>PAN</th><th>Importe original</th><th>Estado</th></tr></thead><tbody id="rows"></tbody></table></section></main></div><script src="js/issuer-store.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){const db=OSCIssuerStore.read(),a=db.accounts[0];customer.textContent=a.customer;count.textContent=a.movements.length;updated.textContent=new Date(db.updatedAt).toLocaleString('es-AR');rows.innerHTML=a.movements.map(m=>`<tr><td>${new Date(m.createdAt).toLocaleString('es-AR')}</td><td>${esc(m.network)}</td><td>${esc(m.merchant)}</td><td>${esc(m.country)}</td><td>•••• ${esc(m.panLast4)}</td><td>${(m.originalAmountMinor/100).toLocaleString('es-AR',{minimumFractionDigits:2})} ${esc(m.originalCurrency)}</td><td style="color:#61e8aa">CONTABILIZADO</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Procesá un archivo Incoming desde el Switch Emisor.</td></tr>'}render();</script></body></html>
