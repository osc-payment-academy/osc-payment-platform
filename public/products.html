<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productos · Panel OSC</title><link rel="stylesheet" href="css/saas.css"></head><body><main class="shell"><header class="top"><div><div class="brand"><span>OSC</span> ACADEMY</div><h1>Productos SaaS</h1><p class="muted">La misma base de Login y licencias puede funcionar con Payment Academy o completamente vacía.</p></div><nav class="tabs"><a class="btn" href="saas-admin.html">← Panel OSC</a><button class="btn" id="logout">Cerrar sesión</button></nav></header><section class="panel"><h2>Crear producto</h2><form id="form"><div class="field"><label>Nombre</label><input id="name" required></div><div class="field"><label>Contenido inicial</label><select id="core"><option value="1">Con CORE de OSC Payment Academy</option><option value="0">Base vacía para un desarrollo nuevo</option></select></div><button class="btn primary">Crear producto</button></form><div id="message" class="message"></div></section><section class="panel"><h2>Productos disponibles</h2><div id="products"></div></section></main><script src="js/saas-session.js"></script><script>async function load(){const r=await fetch('/api/admin/products');if(r.status===403)return location.href='/';const d=await r.json();products.innerHTML=d.products.map(p=>`<article class="topic"><span class="pill">${p.core_enabled?'CORE PAYMENT':'BASE VACÍA'}</span><h3>${p.name}</h3><p class="muted">${p.slug}</p></article>`).join('')}form.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/products',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name.value,coreEnabled:core.value==='1'})});if(r.ok){message.textContent=core.value==='1'?'Producto creado con el CORE actual.':'Base SaaS vacía creada para el nuevo desarrollo.';message.className='message show ok';form.reset();load()}else{message.textContent='No se pudo crear el producto.';message.className='message show error'}};load();</script></body></html>
