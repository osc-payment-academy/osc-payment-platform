<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg"><stop stop-color="#0b3150"/><stop offset="1" stop-color="#071724"/></linearGradient><style>.t{font-family:Arial,sans-serif;fill:#fff}.m{font-family:Consolas,monospace}.box{fill:#0b2032;stroke:#2b638b;stroke-width:2}.blue{fill:#56baff}.muted{fill:#b4c9d9}.pill{fill:#123f62}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="86" fill="#103969"/><text class="t" x="54" y="38" font-size="22" font-weight="700" fill="#efc557">OSC PAYMENT ACADEMY</text><text class="t" x="54" y="70" font-size="30" font-weight="700">Fundamentos técnicos antes de ISO 8583</text><text class="t muted" x="1545" y="53" text-anchor="end" font-size="20">TIPOS DE DATOS Y CODIFICACIÓN</text><text class="t" x="800" y="165" text-anchor="middle" font-size="34">El mismo dato puede ocupar distinta cantidad de bytes</text><text class="t" x="800" y="230" text-anchor="middle" font-size="30">Dato lógico: <tspan font-size="46" font-weight="700" fill="#efc557">123456</tspan></text><g transform="translate(48 285)"><rect class="box" width="350" height="405" rx="22"/><text class="t blue" x="28" y="55" font-size="30" font-weight="700">ASCII</text><text class="t m" x="28" y="125" font-size="28">31 32 33 34 35 36</text><text class="t muted" x="28" y="190" font-size="21">Un byte por dígito</text><rect class="pill" x="28" y="300" width="132" height="52" rx="26"/><text class="t" x="94" y="335" text-anchor="middle" font-size="22">6 bytes</text></g><g transform="translate(432 285)"><rect class="box" width="350" height="405" rx="22"/><text class="t blue" x="28" y="55" font-size="30" font-weight="700">EBCDIC</text><text class="t m" x="28" y="125" font-size="28">F1 F2 F3 F4 F5 F6</text><text class="t muted" x="28" y="190" font-size="21">Texto de mainframe</text><rect class="pill" x="28" y="300" width="132" height="52" rx="26"/><text class="t" x="94" y="335" text-anchor="middle" font-size="22">6 bytes</text></g><g transform="translate(816 285)"><rect class="box" width="350" height="405" rx="22"/><text class="t blue" x="28" y="55" font-size="30" font-weight="700">BCD</text><text class="t m" x="28" y="125" font-size="34">12 34 56</text><text class="t muted" x="28" y="190" font-size="21">Dos dígitos por byte</text><rect class="pill" x="28" y="300" width="132" height="52" rx="26"/><text class="t" x="94" y="335" text-anchor="middle" font-size="22">3 bytes</text></g><g transform="translate(1200 285)"><rect class="box" width="350" height="405" rx="22"/><text class="t blue" x="28" y="55" font-size="30" font-weight="700">BINARIO</text><text class="t m" x="28" y="125" font-size="34">01 E2 40</text><text class="t muted" x="28" y="190" font-size="21">Valor entero en base 2</text><rect class="pill" x="28" y="300" width="132" height="52" rx="26"/><text class="t" x="94" y="335" text-anchor="middle" font-size="22">3 bytes</text></g><rect x="48" y="730" width="1502" height="112" rx="18" fill="#172b36" stroke="#efc557" stroke-width="2"/><text class="t" x="84" y="780" font-size="24" font-weight="700" fill="#efc557">PUNTO CLAVE</text><text class="t muted" x="84" y="818" font-size="22">Para interpretar una trama hay que conocer el tipo de dato, la codificación y la longitud definida.</text></svg>
