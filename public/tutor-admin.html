<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutor OSC · Bandeja de conocimiento</title><link rel="stylesheet" href="css/saas.css"><style>.question{border:1px solid #284d68;border-radius:13px;padding:14px;margin:12px 0;background:#091d2d}.question header{display:flex;justify-content:space-between;gap:12px}.question small{color:#91aec2}.question textarea,.question input,.question select{width:100%;margin-top:8px;padding:9px;border-radius:8px;border:1px solid #345d77;background:#061521;color:#fff}.question textarea{min-height:90px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.state{color:#efc65f;font-weight:800}.empty{padding:30px;text-align:center;color:#9bb3c4}</style></head><body><main class="shell"><header class="top"><div><div class="brand"><span>OSC</span> ACADEMY</div><h1>Bandeja de conocimiento pendiente</h1><p class="muted">Las respuestas solo se incorporan a Tutor OSC después de tu aprobación.</p></div><nav class="tabs"><a class="btn" href="saas-admin.html">← Panel OSC</a><button class="btn" id="reload">Actualizar</button></nav></header><section class="panel"><div id="list" class="empty">Cargando consultas…</div></section></main><script src="js/saas-session.js"></script><script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const r=await fetch('/api/admin/tutor/pending');if(r.status===403)return location.href='/';const j=await r.json(),rows=j.pending||[];list.innerHTML=rows.length?rows.map(q=>`<article class="question" data-id="${esc(q.id)}"><header><div><b>${esc(q.question)}</b><small>${esc(q.full_name)} · ${esc(q.tenant_name||q.tenant_id)} · ${new Date(q.created_at).toLocaleString('es-AR')}</small></div><span class="state">${esc(q.status)}</span></header><label>Respuesta aprobada<textarea class="answer">${esc(q.answer)}</textarea></label><label>Palabras clave<input class="keywords" value="${esc(q.question)}"></label><label>Referencia obligatoria<input class="reference" placeholder="Manual · capítulo · sección · página"></label><label>Comportamiento<select class="behavior"><option>EXPLICAR</option><option>GUIAR</option><option>REFERENCIAR</option></select></label><div class="actions"><button class="btn primary" data-action="APPROVED">Aprobar e incorporar</button><button class="btn" data-action="IN_REVIEW">En revisión</button><button class="btn" data-action="CONSULTORIA">Consultoría OSC</button><button class="btn" data-action="OUT_OF_SCOPE">Fuera de alcance</button></div></article>`).join(''):'<div class="empty">No hay consultas pendientes.</div>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>review(b));}
async function review(btn){const card=btn.closest('.question'),status=btn.dataset.action,body={status,answer:card.querySelector('.answer').value,keywords:card.querySelector('.keywords').value,reference:card.querySelector('.reference').value,behavior:card.querySelector('.behavior').value};const r=await fetch('/api/admin/tutor/pending/'+card.dataset.id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!r.ok){const j=await r.json();return alert(j.error==='ANSWER_AND_REFERENCE_REQUIRED'?'Para aprobar se necesita respuesta y referencia.':'No se pudo actualizar.');}load();}
reload.onclick=load;load();
</script></body></html>
