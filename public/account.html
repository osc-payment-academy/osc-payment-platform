<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mi cuenta · OSC Academy</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="css/saas.css">
</head>
<body>
<main class="auth">
  <section class="auth-card">
    <div class="brand"><span>OSC</span> ACADEMY</div>
    <p class="eyebrow">Seguridad</p>
    <h1>Mi cuenta</h1>
    <p class="muted" id="identity">Cargando usuario…</p>
    <form id="passwordForm">
      <div class="field"><label for="currentPassword">Contraseña actual</label><input id="currentPassword" type="password" autocomplete="current-password" required></div>
      <div class="field"><label for="newPassword">Nueva contraseña</label><input id="newPassword" type="password" autocomplete="new-password" minlength="10" required></div>
      <div class="field"><label for="confirmPassword">Repetir nueva contraseña</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></div>
      <button class="btn primary full" type="submit">Cambiar contraseña</button>
    </form>
    <div id="message" class="message"></div>
    <p style="text-align:center"><a href="index.html">Volver a la plataforma</a></p>
  </section>
</main>
<script src="js/saas-session.js"></script>
<script>
(async()=>{const data=await OSCSession.me();if(data)identity.textContent=`${data.user.full_name} · ${data.user.email}`})();
passwordForm.onsubmit=async event=>{event.preventDefault();message.className='message';if(newPassword.value!==confirmPassword.value){message.textContent='Las nuevas contraseñas no coinciden.';message.className='message show error';return}const response=await fetch('/api/auth/change-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({currentPassword:currentPassword.value,newPassword:newPassword.value})});if(response.ok){passwordForm.reset();message.textContent='Contraseña actualizada correctamente.';message.className='message show ok'}else{const data=await response.json();message.textContent=data.error==='INVALID_CURRENT_PASSWORD'?'La contraseña actual no es correcta.':'La nueva contraseña debe tener al menos 10 caracteres.';message.className='message show error'}};
</script>
</body>
</html>
