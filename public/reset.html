<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar contraseña · OSC Academy</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="css/saas.css"></head><body><main class="auth"><section class="auth-card"><div class="brand"><span>OSC</span> ACADEMY</div><p class="eyebrow">Seguridad</p><h1 id="title">Recuperar contraseña</h1><form id="requestForm"><p class="muted">Ingresá tu correo. Si está registrado, recibirás un enlace válido durante 30 minutos.</p><div class="field"><label>Correo electrónico</label><input id="email" type="email" required></div><button class="btn primary full">Enviar instrucciones</button></form><form id="confirmForm" hidden><p class="muted">La contraseña debe tener al menos 10 caracteres.</p><div class="field"><label>Nueva contraseña</label><input id="password" type="password" minlength="10" required></div><button class="btn primary full">Guardar nueva contraseña</button></form><div id="message" class="message"></div><p style="text-align:center"><a href="login.html">Volver al Login</a></p></section></main><script>const token=new URLSearchParams(location.search).get('token'),req=document.getElementById('requestForm'),con=document.getElementById('confirmForm'),msg=document.getElementById('message');if(token){req.hidden=true;con.hidden=false;title.textContent='Crear nueva contraseña'}function show(t,e=false){msg.textContent=t;msg.className='message show '+(e?'error':'ok')}req.onsubmit=async e=>{e.preventDefault();await fetch('/api/auth/forgot',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value})});req.hidden=true;show('Si el correo está registrado, recibirá las instrucciones.')};con.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:password.value})});if(r.ok){con.hidden=true;show('Contraseña actualizada. Ya podés ingresar.')}else show('El enlace venció o la contraseña no cumple los requisitos.',true)};</script></body></html>
