<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Soporte Online · OSC Payment Academy</title><link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="css/saas.css">
</head>
<body>
<main class="shell">
  <header class="top">
    <div><div class="brand"><span>OSC</span> PAYMENT ACADEMY</div><h1>Soporte Online</h1><p class="muted">Consultas a OSC Payment Academy. Las respuestas quedan visibles para todo tu grupo.</p></div>
    <nav class="tabs"><a class="btn" href="index.html">Dashboard</a><button class="btn" id="logout">Cerrar sesión</button></nav>
  </header>
  <section class="panel">
    <div class="field"><label>Grupo</label><select id="cohort"></select></div>
    <div id="courseState" class="muted"></div>
  </section>
  <section class="panel" id="askPanel">
    <h2>Nueva consulta</h2>
    <form id="topicForm" class="form-grid">
      <div class="field"><label>Módulo</label><select id="moduleKey"><option>GENERAL</option><option>POS</option><option>ATM</option><option>PARSER</option><option>CONSTRUCTOR</option><option>SWITCH_ADQUIRENTE</option><option>ISO_8583</option><option>WALLET</option><option>ECOMMERCE</option><option>SWITCH_EMISOR</option><option>RED_LINK</option><option>EVALUACIONES</option></select></div>
      <div class="field"><label>Título</label><input id="topicTitle" required></div>
      <div class="field full-row"><label>Consulta</label><textarea id="topicBody" required placeholder="Contá qué estabas haciendo, qué esperabas y qué pasó. Podés pegar una captura de pantalla con Ctrl+V."></textarea></div>
      <div class="full-row"><button class="btn primary">Enviar consulta</button></div>
    </form>
    <div id="message" class="message"></div>
  </section>
  <section class="panel"><h2>Consultas del grupo</h2><div id="topics"><p class="muted">Seleccioná un grupo.</p></div></section>
</main>
<script src="js/saas-session.js"></script><script src="js/support-images.js?v=4.0.0-rc1.27"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
// rc.1.27 · Canales: ediciones del curso (foro de la cohorte) y consultoras. Responde la administración OSC.
let CH=[],ADMIN=false;const ATT=OSCSupportImages.attach(document.getElementById('topicBody'));
const cur=()=>CH.find(c=>`${c.kind}:${c.id}`===cohort.value);
const topicsUrl=c=>c.kind==='tenant'?`/api/support/tenants/${c.id}/topics`:`/api/cohorts/${c.id}/topics`;
async function init(){
  const r=await fetch('/api/support/channels');if(r.status===401)return location.href='login.html';
  const d=r.ok?await r.json():{channels:[]};CH=d.channels||[];ADMIN=!!d.admin;
  const groups=[...new Set(CH.map(c=>c.group))];
  cohort.innerHTML=CH.length?groups.map(g=>`<optgroup label="${esc(g)}">${CH.filter(c=>c.group===g).map(c=>`<option value="${c.kind}:${c.id}">${esc(c.label)}${ADMIN&&c.pending?` · ${c.pending} pendiente${c.pending>1?'s':''}`:''}</option>`).join('')}</optgroup>`).join(''):'<option value="">Sin grupos con soporte</option>';
  if(ADMIN){const first=CH.find(c=>c.pending);if(first)cohort.value=`${first.kind}:${first.id}`;}
  const prev=new URLSearchParams(location.search).get('g');if(prev&&CH.some(c=>`${c.kind}:${c.id}`===prev))cohort.value=prev;
  cohort.onchange=load;load();
}
async function load(){
  const c=cur();if(!c)return;
  const r=await fetch(topicsUrl(c));if(!r.ok){topics.innerHTML='<p class="muted">No tenés acceso a este grupo.</p>';return;}
  const d=await r.json();
  const closed=c.kind==='cohort'&&(d.cohort.forumStatus!=='OPEN'||new Date(d.cohort.expiresAt)<=new Date());
  courseState.textContent=c.kind==='tenant'?`Consultora · ${ADMIN?'respondés como OSC Payment Academy':'te responde OSC Payment Academy'}`:`Acceso hasta ${new Date(d.cohort.expiresAt).toLocaleDateString('es-AR')} · Foro ${closed?'cerrado':'activo'}`;
  askPanel.style.display=closed?'none':'block';
  const st=t=>t.status==='OPEN'?'<span class="pill" style="background:#5a4a12;color:#ffe08a">Pendiente de respuesta</span>':'<span class="pill">Respondida</span>';
  topics.innerHTML=d.topics.map(t=>`<article class="topic" tabindex="0" role="link" onclick="location.href='topic.html?id=${encodeURIComponent(t.id)}&kind=${c.kind}&g=${encodeURIComponent(cohort.value)}'"><div class="topic-head"><span class="pill">${esc(t.module_key)}</span>${st(t)}<span class="muted">${new Date(t.created_at).toLocaleString('es-AR')}</span></div><h3>${esc(t.title)}</h3><p>${esc(t.body)}</p><small class="muted">${esc(t.author_name)} · ${t.reply_count} respuestas${t.image_count?` · 📎 ${t.image_count}`:''}</small></article>`).join('')||'<p class="muted">Todavía no hay consultas en este grupo.</p>';
}
topicForm.onsubmit=async e=>{
  e.preventDefault();const c=cur();if(!c)return;
  const r=await fetch(topicsUrl(c),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({moduleKey:moduleKey.value,title:topicTitle.value,body:topicBody.value,images:ATT.list()})});
  if(r.ok){topicForm.reset();ATT.clear();message.textContent='Consulta enviada. La respuesta de OSC va a aparecer acá.';message.className='message show ok';load()}
  else{message.textContent='El foro está cerrado o no tenés acceso.';message.className='message show error'}
};
init();
</script>
</body></html>
