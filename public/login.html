<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar · OSC Academy</title><link rel="stylesheet" href="css/saas.css"></head><body><main class="auth"><section class="auth-card"><div class="brand"><span>OSC</span> ACADEMY</div><p class="eyebrow">Acceso restringido</p><h1>Ingresar a la plataforma</h1><p class="muted">Utilizá el correo registrado para acceder a tu curso, consultora y workspace personal.</p><form id="loginForm"><div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><div id="message" class="message"></div><button class="btn primary full" type="submit">Ingresar</button></form><p style="text-align:center"><a href="reset.html">Olvidé mi contraseña</a></p></section></main><script>const form=document.getElementById('loginForm'),msg=document.getElementById('message'),next=new URLSearchParams(location.search).get('next')||'/';function show(t,e=false){msg.textContent=t;msg.className='message show '+(e?'error':'ok')}form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});if(!r.ok)throw Error();location.href=next}catch{show('Correo o contraseña incorrectos, o acceso suspendido.',true)}finally{button.disabled=false}};</script></body></html>
